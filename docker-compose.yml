#version: '3.8'

services:
  # Service API FastAPI
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: ml-pipeline-api
    ports:
      - "8000:8000"
    volumes:
      - ./deploy:/app/deploy:ro
      - ./build:/app/build:ro
      - ./.env:/app/.env:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DEBUG=True
    networks:
      - ml-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Service Streamlit Dashboard - CORRIGÉ
  streamlit:
    build:
      context: ./app  # ← CONTEXTE CORRECT
      dockerfile: Dockerfile  # ← Chemin relatif au contexte
    container_name: ml-pipeline-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./deploy:/app/deploy:ro
      - ./build:/app/build:ro
      - ./data:/app/data:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    networks:
      - ml-network
    restart: unless-stopped
    depends_on:
      - api

networks:
  ml-network:
    driver: bridge

volumes:
  model_data:
    driver: local