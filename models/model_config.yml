data:
  test_path: data/iris_test.csv
  test_split: 0.2
  train_path: data/iris_train.csv
  validation_split: 0.2

evaluation:
  metrics:
  - accuracy
  - precision
  - recall
  - f1

model:
  algorithm: random_forest
  name: IrisClassifier
  type: classification
  version: 1.0.0

parameters:
  max_depth: 10
  min_samples_leaf: 1
  min_samples_split: 2
  n_estimators: 100

training:
  batch_size: 32
  epochs: 100
  learning_rate: 0.001
  validation_split: 0.2